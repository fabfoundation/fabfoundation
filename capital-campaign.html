<!DOCTYPE html>
<html lang="en">

<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Fab Hub Kendall Capital Campaign</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
    }

    #book {
      width: 100%;
      height: 100vh;

      --fb-bg: #fff;
    }
  </style>
</head>

<body>

  <div id="book"></div>

  <script src="/js/pdflipbook.js"></script>

  <script>
    PDFlipbook.create(
      document.querySelector('#book'),
      {
        url: '/resource-folder/pdfs/kendall_capital_campaign.pdf',

        pdfjsSrc: '/js/pdfjs/pdf.min.mjs',
        pdfWorkerSrc: '/js/pdfjs/pdf.worker.min.mjs',
        
        displayMode: 'auto',

        controls: true,
        arrows: true,
        pageNumbers: true,

        shadow: 'always',

        padding: 24
      }
    );
  </script>

</body>
</html>
